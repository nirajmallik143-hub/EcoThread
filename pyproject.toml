[build-system]
requires = ["setuptools>=78.1.1", "wheel>=0.46.2"]
build-backend = "setuptools.build_meta"

[project]
name = "ecothread"
version = "2.6.0"
description = "Green-AI static code analyzer, algorithmic energy optimizer, and dual-gate CLI/Web system."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Niraj Mallik", email = "nirajmallik143@gmail.com" },
]
maintainers = [
    { name = "Mallik Group Holdings", email = "nirajmallik143@gmail.com" },
]
keywords = [
    "green-ai",
    "code-optimizer",
    "static-analysis",
    "sustainability",
    "ast",
    "cli",
    "mallik-group",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Compilers",
]
dependencies = []

[project.optional-dependencies]
web = ["flask>=3.0.0", "gunicorn>=21.2.0"]
dev = ["pytest>=8.0.0", "ruff>=0.4.0"]

[project.urls]
Homepage = "https://github.com/Mallikgroup-for-Humanity/EcoThread"
Repository = "https://github.com/Mallikgroup-for-Humanity/EcoThread.git"
"Live Portal" = "https://mallikgroup-for-humanity.github.io/EcoThread/"
Issues = "https://github.com/Mallikgroup-for-Humanity/EcoThread/issues"

[project.scripts]
ecothread = "main:main"

[tool.setuptools]
py-modules = ["main", "ecothread", "ecothread_pro_gate", "activate_ecothread_customer"]
packages = ["engine", "api", "worker"]

[tool.setuptools.package-data]
"*" = ["*.html", "*.json", "*.md", "*.svg"]
